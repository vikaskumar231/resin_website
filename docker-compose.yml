version: '3.8'

services:
  artaalay-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: artaalay-web:latest
    container_name: artaalay_production
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    volumes:
      # Persistent storage mounts: ensures orders, products, categories & media persist across restarts
      - ./src/data:/app/src/data
      - ./public/uploads:/app/public/uploads
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

